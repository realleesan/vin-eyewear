# =============================================================================
# docker/apache-vhost.conf
#
# VirtualHost mặc định cho container app. DocumentRoot trỏ THẲNG vào
# /var/www/html vì dự án đặt mã nguồn cùng cấp thư mục gốc web (không có
# public/ riêng) — giống hệt cách nó chạy trên XAMPP.
#
# AllowOverride All là bắt buộc: mọi luật định tuyến, chặn file nhạy cảm và
# header bảo mật của dự án nằm trong .htaccess ở gốc repo, không phải ở đây.
# File này chỉ bật quyền cho .htaccess hoạt động, không lặp lại luật của nó.
# =============================================================================
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
