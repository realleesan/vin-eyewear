; =============================================================================
; docker/php.ini
;
; Chỉnh vài giới hạn mặc định của PHP cho phù hợp việc tải ảnh lên (avatar,
; ảnh sản phẩm, ảnh bộ sưu tập — xem core/ImageUploader.php). Mặc định của
; image php:8.2-apache (upload_max_filesize=2M) quá nhỏ cho ảnh chụp điện
; thoại hiện nay.
;
; display_errors để Off ở đây làm NỀN AN TOÀN — App::configureErrors() trong
; core/App.php tự ini_set lại thành On khi APP_DEBUG=true, nên máy dev vẫn
; thấy lỗi chi tiết, còn lỡ quên .env thì mặc định vẫn là ẩn lỗi.
; =============================================================================
upload_max_filesize = 20M
post_max_size = 20M
memory_limit = 256M
max_execution_time = 60

display_errors = Off
log_errors = On
